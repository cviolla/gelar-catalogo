<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auxiliar de Imagens - Gelar Hub</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 2rem; }
        .product-item { 
            background: #1e293b; 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }
        a { 
            background: #38bdf8; 
            color: #000; 
            padding: 0.5rem 1rem; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
        }
        a:hover { background: #0ea5e9; }
        code { background: #000; padding: 0.2rem 0.5rem; border-radius: 4px; color: #fbbf24; }
    </style>
</head>
<body>
    <h1>Galeria de Busca de Imagens</h1>
    <p>Use os links abaixo para encontrar a imagem ideal. Salve o arquivo na pasta <code>public/images</code> com o nome sugerido.</p>

    <div id="list"></div>

    <script type="module">
        import { products } from './src/data/products.js';

        const list = document.getElementById('list');

        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-item';
            
            const query = encodeURIComponent(`${p.name} ${p.volume} png fundo transparente`);
            const googleLink = `https://www.google.com/search?q=${query}&tbm=isch`;
            const suggestedName = p.id + '.png';

            div.innerHTML = `
                <div>
                    <strong>${p.name}</strong> (${p.volume})<br>
                    <small>Nome sugerido: <code>${suggestedName}</code></small>
                </div>
                <a href="${googleLink}" target="_blank">Buscar Imagem</a>
            `;
            list.appendChild(div);
        });
    </script>
</body>
</html>
