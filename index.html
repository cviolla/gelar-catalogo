<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gelar Bebidas</title>
</head>

<body>
  <div id="root">
    <div
      style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: white; font-family: sans-serif;">
      <h1>Carregando Sistema...</h1>
    </div>
  </div>
  <script>
    window.onerror = function (msg, url, line, col, error) {
      document.body.innerHTML = `
        <div style="background: #0f172a; color: #ef4444; padding: 20px; font-family: sans-serif; height: 100vh;">
          <h1>Erro Crítico</h1>
          <p>${msg}</p>
          <pre>${error ? error.stack : 'No stack'}</pre>
          <button onclick="localStorage.clear(); window.location.reload()">RESETAR TUDO</button>
        </div>
      `;
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
